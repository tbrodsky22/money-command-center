<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Reset password</title><style>body{font-family:system-ui;margin:0;background:#f5f7fb;color:#172033}.card{max-width:460px;margin:70px auto;background:#fff;border:1px solid #e3e8ef;border-radius:18px;padding:24px}input,button{font:inherit;width:100%;box-sizing:border-box;padding:12px;border-radius:10px;margin-top:10px}input{border:1px solid #ccd4df}button{border:0;background:#111827;color:#fff;cursor:pointer}.muted{color:#667085}.msg{margin-top:12px}</style></head><body><div class="card"><h1>Reset your password</h1><p class="muted">Choose a new password with at least 8 characters.</p><input id="p1" type="password" placeholder="New password"><input id="p2" type="password" placeholder="Confirm password"><button id="go">Reset password</button><div id="msg" class="msg"></div></div><script>document.getElementById('go').onclick=async()=>{const b=document.getElementById('go'),m=document.getElementById('msg'),p1=document.getElementById('p1').value,p2=document.getElementById('p2').value,t=new URLSearchParams(location.search).get('token')||'';if(p1.length<8)return m.textContent='Use at least 8 characters.';if(p1!==p2)return m.textContent='Passwords do not match.';b.disabled=true;try{const r=await fetch('/api/auth/reset-password',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({token:t,password:p1})}),j=await r.json().catch(()=>({}));if(!r.ok)throw new Error(j.error||'Could not reset password');m.innerHTML='Password updated. <a href="/">Return to Money Command Center</a>'}catch(e){m.textContent=e.message;b.disabled=false}}</script></body></html>
